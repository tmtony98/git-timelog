<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git timelog</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1d1f; --muted: #6b6e75; --line: #e4e2dc;
  --accent: #2d6a4f; --accent-ink: #ffffff; --warn: #b45309; --chip: #efede7;
  --c0: #2d6a4f; --c1: #3a86ff; --c2: #e76f51; --c3: #8e7dbe; --c4: #e9b949; --c5: #4ca5a8; --c6: #c44569; --c7: #7a7d84;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131416; --panel: #1c1d20; --ink: #ecebe7; --muted: #9a9ca3; --line: #2c2e33;
    --accent: #52b788; --accent-ink: #0d1f16; --warn: #f59e0b; --chip: #26282c;
    --c0: #52b788; --c1: #6aa5ff; --c2: #f08a6e; --c3: #a99ad6; --c4: #f0c95c; --c5: #6cc3c6; --c6: #e06b8b; --c7: #9a9ca3;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.spacer { flex: 1; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input, select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.timer { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 6px 4px 14px; }
.timer .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.timer.on .dot { background: var(--warn); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.timer .clock { font-variant-numeric: tabular-nums; font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.kpi, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.kpi { padding: 14px 16px; }
.kpi .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .l { color: var(--muted); font-size: 12px; }
.panel { padding: 16px; margin-bottom: 20px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--bg); border-radius: 10px; padding: 10px; min-height: 120px; border: 1px dashed transparent; }
.col.over { border-color: var(--accent); }
.col h3 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; color: var(--muted); font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: grab; }
.card:active { cursor: grabbing; }
.card .t { font-weight: 600; word-break: break-word; }
.card .s { color: var(--muted); font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.badge.hold { color: var(--warn); }
.badge.agent { color: var(--accent); }
.col[data-status="hold"] .card { opacity: .78; }
.card .meta .h { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .acts { display: none; gap: 6px; margin-top: 8px; }
.card:hover .acts, .card:focus-within .acts { display: flex; }
.card .acts button { padding: 2px 8px; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.grid2 .panel { margin-bottom: 0; }
svg text { fill: var(--muted); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.feed { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
.feed li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.feed time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.feed .k { font-size: 11px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
.n { text-align: right; font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
.tablewrap { overflow-x: auto; }
.addrow { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.addrow input { flex: 1; min-width: 180px; }
/* task detail modal */
.card { cursor: pointer; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
dialog#detail { margin: auto; width: 720px; max-width: calc(100vw - 32px); max-height: min(86vh, 900px); padding: 0;
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink);
  box-shadow: 0 30px 80px rgba(0,0,0,.45); overflow: auto; }
dialog#detail::backdrop { background: rgba(0,0,0,.45); }
.dt-head { position: sticky; top: 0; background: var(--panel); padding: 18px 22px 14px; border-bottom: 1px solid var(--line); z-index: 1; }
.dt-head .row { display: flex; gap: 10px; align-items: flex-start; }
.dt-head h2 { font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0; flex: 1; word-break: break-word; }
.dt-head .sub { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dt-close { padding: 2px 10px; font-size: 18px; line-height: 1.2; }
.dt-body { padding: 4px 22px 26px; }
.dt-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
.dt-total { display: flex; align-items: baseline; gap: 8px; }
.dt-total b { font-size: 26px; font-variant-numeric: tabular-nums; }
.dt-total span { color: var(--muted); font-size: 12px; }
.dt-split { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.dt-split div { background: var(--bg); border-radius: 8px; padding: 8px; }
.dt-split b { display: block; font-variant-numeric: tabular-nums; }
.dt-split span { color: var(--muted); font-size: 11px; }
.dt-list { list-style: none; padding: 0; margin: 0; }
.dt-list li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.dt-list li:last-child { border-bottom: 0; }
.dt-list .l1 { display: flex; gap: 8px; align-items: baseline; }
.dt-list .l1 .grow { flex: 1; min-width: 0; word-break: break-word; }
.dt-list .l2 { color: var(--muted); font-size: 12px; margin-top: 3px; }
.dt-list code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; color: var(--muted); }
.dt-list .n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.dt-empty { color: var(--muted); font-size: 13px; }
.dt-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 9px 0 0; font-size: 12px; align-items: start; }
.dt-kv dt { color: var(--muted); padding-top: 3px; }
.dt-kv dd { margin: 0; min-width: 0; }
.dt-kv code.sel { color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px;
  word-break: break-all; user-select: all; display: inline-block; }
.dt-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.dt-acts button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; }
.dt-why { color: var(--muted); font-size: 12px; margin-top: 7px; }
@media (max-width: 520px) {  /* phones: full-screen sheet */
  dialog#detail { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; border: 0; border-radius: 0; }
  .dt-split { grid-template-columns: repeat(2, 1fr); } }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.toast.act { pointer-events: auto; display: flex; gap: 12px; align-items: center; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; }
.card .acts .del { margin-left: auto; }
.card .acts .del:hover, .card .acts .del.armed { color: #fff; background: #c0392b; border-color: #c0392b; }
@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .board { grid-template-columns: repeat(2, 1fr); }
  .grid2 { grid-template-columns: 1fr; }
}
@media (max-width: 520px) { .board { grid-template-columns: 1fr; } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -4px 0 20px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 14px 9px;
  color: var(--muted); white-space: nowrap; display: flex; gap: 8px; align-items: baseline; }
.tab:hover { color: var(--ink); border-color: var(--line); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { font-size: 12px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.projhead { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; }
.projhead h2 { font-size: 20px; text-transform: none; letter-spacing: -0.01em; color: var(--ink); margin: 0; }
.projhead span { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>git timelog <small>task &amp; time tracking for agentic coding</small></h1>
    <div class="spacer"></div>
    <div class="timer" id="timer"><span class="dot"></span><span id="timerLabel">No timer</span>
      <span class="clock" id="timerClock"></span><button id="timerStop" hidden>Stop</button></div>
    <button id="reportBtn">Write standup</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Projects"></nav>
  <div class="projhead"><h2 id="projName"></h2><span id="projRepos"></span></div>

  <section class="kpis" id="kpis"></section>

  <section class="panel">
    <h2>Tasks</h2>
    <form class="addrow" id="addForm">
      <input id="addTitle" placeholder="New task (non-git work: meeting, design review…)" required>
      <select id="addRepo"></select>
      <button class="primary">Add</button>
    </form>
    <div class="board" id="board"></div>
  </section>

  <div class="grid2">
    <section class="panel">
      <h2>Hours · last 14 days</h2>
      <div id="chart"></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="panel">
      <h2>Activity</h2>
      <ul class="feed" id="feed"></ul>
    </section>
  </div>

  <section class="panel" style="margin-top:20px">
    <h2 id="tableTitle">All tasks</h2>
    <div class="tablewrap"><table id="table"></table></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<dialog id="detail" aria-labelledby="dt-title" aria-modal="true"><div id="dt-content"></div></dialog>

<script>
const STATUSES = ["todo", "doing", "hold", "done"];
const LABELS = {todo: "todo", doing: "doing", hold: "on hold", done: "done"};
const COLORS = Array.from({length: 8}, (_, i) => `var(--c${i})`);
let data = null;   // full summary from the server
let view = null;   // the selected project's slice of it
let project = null;
const ALL = "All projects";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = (ts) => {
  const s = Date.now() / 1000 - ts;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const fmtH = (h) => h >= 10 ? h.toFixed(0) + "h" : h.toFixed(1) + "h";

async function api(path, method = "GET", body) {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return r.json();
}
let toastTimer;
function toast(msg, actionLabel, action) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.toggle("act", !!action);
  if (action) {
    const b = document.createElement("button");
    b.textContent = actionLabel;
    b.onclick = () => { t.classList.remove("show", "act"); action(); };
    t.appendChild(b);
  }
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show", "act"), action ? 6000 : 2200);
}

async function load() {
  data = await api("/api/summary"); pickProject(); render();
  if ($("detail").open && detailId) openDetail(detailId);  // keep an open modal current
}

// ---- task detail modal: where this task's time came from ----
let detailId = null, detailOpener = null;
const AGENT_NAMES = {claude: "Claude Code", codex: "Codex", gemini: "Gemini CLI", cursor: "Cursor"};
const COPY_ICON = `<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`;
const dur = (s) => { const m = Math.round(s / 60); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };
const when = (ts) => new Date(ts * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
async function openDetail(id, opener) {
  let d;
  try { d = await api(`/api/task/${id}`); } catch (e) { toast("Couldn't load task: " + e.message); return; }
  detailId = id; if (opener) detailOpener = opener;
  const t = d.task, tot = d.totals;
  const split = [["git", "Git"], ["agent", "Agent"], ["timer", "Timer"], ["manual", "Logged"]]
    .map(([k, l]) => `<div><b>${dur(tot[k])}</b><span>${l}</span></div>`).join("");
  const sessions = d.sessions.map(s => {
    const name = AGENT_NAMES[s.agent] || "agent";
    const why = s.resume ? "" : ({gemini: "Gemini CLI resumes by list position: run gemini --list-sessions in that folder.",
                                  cursor: "Reopen it from Cursor's chat history."}[s.agent]
                                 || "Recorded before the agent was known; if it was Claude Code, run claude --resume with this ID in its project folder.");
    return `<li><div class="l1"><span class="grow">${s.title ? esc(s.title) : "<span style='color:var(--muted)'>(no title)</span>"}</span><span class="n">${dur(s.seconds)}</span></div>
      <div class="l2">${s.agent ? `<span class="badge agent">${esc(name)}</span> ` : ""}${s.turns} prompt${s.turns === 1 ? "" : "s"} · ${when(s.start)} → ${when(s.end)}${s.ended ? "" : " · open"}</div>
      <dl class="dt-kv"><dt>Session ID</dt><dd><code class="sel">${esc(s.id)}</code></dd>
        ${s.resume ? `<dt>Resume</dt><dd><code class="sel">${esc(s.resume)}</code></dd>` : ""}</dl>
      <div class="dt-acts">
        ${s.resume ? `<button class="primary" data-copy="${esc(s.resume)}" aria-label="Copy the command that resumes this ${esc(name)} session">${COPY_ICON}Copy resume command</button>` : ""}
        <button data-copy="${esc(s.id)}" aria-label="Copy this session's ID">${COPY_ICON}Copy session ID</button></div>
      ${why ? `<div class="dt-why">${esc(why)}</div>` : ""}</li>`; }).join("");
  const commits = d.commits.map(c => `<li><div class="l1"><code>${esc(c.sha.slice(0, 7))}</code><span class="grow">${esc(c.subject)}</span></div>
      <div class="l2">${when(c.ts)} · ${ago(c.ts)}</div></li>`).join("");
  const entries = d.entries.map(e => `<li><div class="l1"><span class="grow">${e.note ? esc(e.note) : (e.source === "timer" ? "Timer" : "Logged time")}</span><span class="n">${dur(e.end - e.start)}${e.running ? " ⏱" : ""}</span></div>
      <div class="l2">${e.source === "timer" ? "timer" : "logged"} · ${when(e.start)}</div></li>`).join("");
  $("dt-content").innerHTML = `
    <div class="dt-head"><div class="row"><h2 id="dt-title">${esc(t.title)}</h2>
      <button class="dt-close" aria-label="Close" onclick="document.getElementById('detail').close()">×</button></div>
      <div class="sub"><span class="badge">${esc(t.status === "hold" ? "on hold" : t.status)}</span>
        ${t.repo ? `<span class="badge">${esc(t.repo)}</span>` : ""}${t.branch && t.branch !== t.title ? `<code>${esc(t.branch)}</code>` : ""}
        ${t.ticket ? `<span class="badge">${esc(t.ticket)}</span>` : ""}${t.pr_url ? `<a href="${esc(t.pr_url)}" target="_blank" rel="noopener">PR ↗</a>` : ""}
        <span>${when(t.first)} → ${ago(t.last)}</span></div></div>
    <div class="dt-body">
      <h3>Time</h3>
      <div class="dt-total"><b>${dur(tot.total)}</b><span>total · overlaps counted once</span></div>
      <div class="dt-split">${split}</div>
      <h3>Agent sessions${d.sessions_total > d.sessions.length ? ` · newest ${d.sessions.length} of ${d.sessions_total}` : ""}</h3>
      ${sessions ? `<ul class="dt-list">${sessions}</ul>` : `<div class="dt-empty">No coding-agent sessions on this task.</div>`}
      <h3>Commits${d.commits_total ? ` · ${d.commits_total}` : ""}${d.commits_total > d.commits.length ? ` (newest ${d.commits.length})` : ""}</h3>
      ${commits ? `<ul class="dt-list">${commits}</ul>` : `<div class="dt-empty">${t.branch ? "No commits yet." : "Not a branch task."}</div>`}
      ${entries ? `<h3>Timer &amp; logged time</h3><ul class="dt-list">${entries}</ul>` : ""}
      ${t.note ? `<h3>Note</h3><div class="dt-empty" style="color:var(--ink)">${esc(t.note)}</div>` : ""}
    </div>`;
  const dlg = $("detail"); if (!dlg.open) dlg.showModal();
}
$("detail").addEventListener("close", () => {  // back to the card (it may have been re-rendered meanwhile)
  const el = document.querySelector(`.card[data-id="${detailId}"]`) || detailOpener; detailId = null; if (el) el.focus(); });
$("detail").addEventListener("click", async (e) => {
  if (e.target.id === "detail") return $("detail").close();  // backdrop
  const btn = e.target.closest && e.target.closest("[data-copy]");
  const text = btn && btn.dataset.copy;
  if (!text) return;
  try { await navigator.clipboard.writeText(text); toast("Copied: " + (text.length > 60 ? text.slice(0, 57) + "…" : text)); }
  catch (err) { window.prompt("Copy this:", text); }
});

// The selected project comes from the URL (#name, bookmarkable), then the last one used.
function pickProject() {
  const names = data.projects.map(p => p.name).concat(ALL);
  let want = decodeURIComponent(location.hash.slice(1));
  if (!names.includes(want)) { try { want = localStorage.getItem("git-timelog.project"); } catch (e) { want = null; } }
  project = names.includes(want) ? want : names[0];
}

function setProject(name) {
  project = name;
  try { localStorage.setItem("git-timelog.project", name); } catch (e) {}
  history.replaceState(null, "", "#" + encodeURIComponent(name));
  render();
}

function slice() {
  if (project === ALL || !data.projects.length) return data;
  const p = data.projects.find(x => x.name === project);
  const tasks = data.tasks.filter(t => t.project === project);
  const ids = new Set(tasks.map(t => String(t.id)));
  return {
    ...data, kpi: p.kpi, repos: p.repos, tasks,
    days: data.days.map(d => ({date: d.date, tasks: Object.fromEntries(Object.entries(d.tasks).filter(([id]) => ids.has(id)))})),
    activity: data.activity.filter(e => e.project === project),
  };
}

function renderTabs() {
  const tabs = data.projects.map(p => ({name: p.name, kpi: p.kpi})).concat([{name: ALL, kpi: data.kpi}]);
  $("tabs").innerHTML = tabs.map(t => `<button class="tab" role="tab" aria-selected="${t.name === project}" data-p="${esc(t.name)}">
    ${esc(t.name)}<span class="n">${t.kpi.active} active · ${fmtH(t.kpi.week)} wk</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => setProject(b.dataset.p));
  $("projName").textContent = project;
  $("projRepos").textContent = view.repos.length === 1 && view.repos[0] === project ? "" : view.repos.join(" · ");
  $("tableTitle").textContent = project === ALL ? "All tasks" : `All ${project} tasks`;
  const sel = $("addRepo"), keep = sel.value;
  sel.innerHTML = view.repos.map(r => `<option>${esc(r)}</option>`).join("") + '<option value="">no repo</option>';
  if (view.repos.includes(keep)) sel.value = keep;
  document.title = `${data.title} · ${project}`;
}

function render() {
  view = slice();
  renderTabs();
  const data = view;
  const k = data.kpi;
  $("kpis").innerHTML = [
    [fmtH(k.today), "Hours today"], [fmtH(k.week), "Hours this week"],
    [k.active, "Active tasks"], [k.commits_week, "Commits this week"],
  ].map(([v, l]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

  // colour the tasks that appear in the chart window, biggest first
  const chartHours = {};
  data.days.forEach(d => Object.entries(d.tasks).forEach(([id, h]) => chartHours[id] = (chartHours[id] || 0) + h));
  const colorOf = {};
  Object.entries(chartHours).sort((a, b) => b[1] - a[1]).forEach(([id], i) => colorOf[id] = COLORS[Math.min(i, 7)]);

  $("board").innerHTML = STATUSES.map(s => {
    const items = data.tasks.filter(t => t.status === s);
    const shown = s === "done" ? items.slice(0, 8) : items;
    return `<div class="col" data-status="${s}"><h3><span>${LABELS[s]}</span><span>${items.length}</span></h3>
      ${shown.map(card).join("")}</div>`;
  }).join("");

  // stacked bars
  const days = data.days, W = 560, H = 180, pad = 22, bw = (W - pad) / days.length;
  const max = Math.max(1, ...days.map(d => Object.values(d.tasks).reduce((a, b) => a + b, 0)));
  const used = new Set();
  let bars = "";
  days.forEach((d, i) => {
    let y = H - pad;
    Object.entries(d.tasks).sort((a, b) => b[1] - a[1]).forEach(([tid, h]) => {
      const bh = (h / max) * (H - pad - 8);
      y -= bh; used.add(+tid);
      const t = data.tasks.find(x => x.id == tid);
      bars += `<rect x="${pad + i * bw + 3}" y="${y}" width="${bw - 6}" height="${bh}" rx="2" fill="${colorOf[tid] || COLORS[7]}"><title>${esc(t?.title)}: ${h.toFixed(1)}h</title></rect>`;
    });
    const dt = new Date(d.date + "T00:00");
    bars += `<text x="${pad + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${dt.getDate()}</text>`;
  });
  const grid = [0, .5, 1].map(f => {
    const y = H - pad - f * (H - pad - 8);
    return `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="0" y="${y + 4}">${(max * f).toFixed(0)}</text>`;
  }).join("");
  $("chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Hours per day">${grid}${bars}</svg>`;
  $("legend").innerHTML = data.tasks.filter(t => used.has(t.id)).sort((a, b) => chartHours[b.id] - chartHours[a.id]).slice(0, 8)
    .map(t => `<span><i style="background:${colorOf[t.id]}"></i>${esc(t.title)}</span>`).join("");

  $("feed").innerHTML = data.activity.slice(0, 40).map(e => `<li><time>${ago(e.ts)}</time><div>
    <div>${e.kind === "checkout" ? "switched to <b>" + esc(e.branch) + "</b>" : esc(e.subject)}</div>
    <div class="k">${esc(e.kind)} · ${esc(e.repo)}${e.kind !== "checkout" ? " · " + esc(e.branch) : ""}</div></div></li>`).join("")
    || "<li>No activity yet. Run <code>git timelog init</code> in a repo, then commit.</li>";

  $("table").innerHTML = `<tr><th>Task</th><th>Repo</th><th>Status</th><th class="n">Hours</th><th class="n">Commits</th><th>Last</th><th>Links</th></tr>` +
    data.tasks.map(t => `<tr><td>${esc(t.title)}</td><td>${esc(t.repo || "—")}</td><td>${t.status}</td>
      <td class="n">${t.hours.toFixed(1)}</td><td class="n">${t.commits}</td><td>${ago(t.last)}</td>
      <td>${t.ticket ? `<span class="badge">${esc(t.ticket)}</span> ` : ""}${t.pr_url ? `<a href="${esc(t.pr_url)}" target="_blank" rel="noopener">PR</a>` : ""}</td></tr>`).join("");

  renderTimer();
  bindDnD();
}

function card(t) {
  return `<div class="card" draggable="true" tabindex="0" data-id="${t.id}" aria-label="${esc(t.title)}: open details">
    <div class="t">${esc(t.title)}</div>
    ${t.last_subject ? `<div class="s" title="${esc(t.last_subject)}">${esc(t.last_subject)}</div>` : ""}
    <div class="meta">${t.session ? `<span class="badge agent" title="Coding-agent session that hasn't touched a branch: research, questions, planning">agent session</span>` : ""}
      ${t.repo ? `<span class="badge">${esc(t.repo)}</span>` : ""}
      ${t.ticket ? `<span class="badge">${esc(t.ticket)}</span>` : ""}
      ${t.status === "hold" ? `<span class="badge hold" title="${t.held_auto ? "Put on hold automatically: not merged and untouched" : "You put this on hold"}">${t.held_auto && t.last_seen ? "idle " + Math.floor((Date.now() / 1000 - t.last_seen) / 86400) + "d" : "on hold"}</span>` : ""}
      <span class="badge">${ago(t.last)}</span><span class="h">${fmtH(t.hours)}</span></div>
    <div class="acts"><button data-act="start">▶ Timer</button><button data-act="log">+ Log</button><button data-act="edit">Edit</button><button data-act="delete" class="del" title="Delete task">Delete</button></div>
  </div>`;
}

function bindDnD() {
  document.querySelectorAll(".card").forEach(c => {
    c.ondragstart = (e) => e.dataTransfer.setData("text/plain", c.dataset.id);
    c.onclick = (e) => { const a = e.target.dataset.act;
      if (a) cardAction(a, +c.dataset.id, e.target); else openDetail(+c.dataset.id, c); };
    c.onkeydown = (e) => { if (e.key === "Enter" && e.target === c) openDetail(+c.dataset.id, c); };
  });
  document.querySelectorAll(".col").forEach(col => {
    col.ondragover = (e) => { e.preventDefault(); col.classList.add("over"); };
    col.ondragleave = () => col.classList.remove("over");
    col.ondrop = async (e) => {
      e.preventDefault(); col.classList.remove("over");
      await api(`/api/task/${e.dataTransfer.getData("text/plain")}`, "PATCH", {status: col.dataset.status});
      load();
    };
  });
}

async function cardAction(act, id, btn) {
  const t = data.tasks.find(x => x.id === id);
  if (act === "delete") {
    // two clicks: the first arms the button, the second (within 3 s) deletes
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed"); btn.textContent = "Sure?";
      setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "Delete"; }, 3000);
      return;
    }
    await api(`/api/task/${id}`, "DELETE");
    toast(`Deleted "${t.title}"`, "Undo", async () => {
      await api(`/api/task/${id}`, "PATCH", {deleted: false}); toast("Restored"); load();
    });
  }
  if (act === "start") { await api("/api/timer", "POST", {action: "start", task_id: id}); toast("Timer: " + t.title); }
  if (act === "log") {
    const v = window.prompt(`Minutes to log on "${t.title}"`, "30");
    if (!v || !(+v > 0)) return;
    const note = window.prompt("Note (optional)", "") || "";
    await api("/api/log", "POST", {task_id: id, minutes: +v, note}); toast(`Logged ${v}m`);
  }
  if (act === "edit") {
    const title = window.prompt("Title", t.title); if (title === null) return;
    const ticket = window.prompt("Ticket (e.g. WEB-142)", t.ticket || ""); if (ticket === null) return;
    const pr_url = window.prompt("PR URL", t.pr_url || ""); if (pr_url === null) return;
    await api(`/api/task/${id}`, "PATCH", {title, ticket, pr_url});
  }
  load();
}

let tick;
function renderTimer() {
  const tm = data.timer, el = $("timer");
  el.classList.toggle("on", !!tm);
  $("timerStop").hidden = !tm;
  $("timerLabel").textContent = tm ? tm.title : "No timer";
  clearInterval(tick);
  const upd = () => {
    if (!tm) return $("timerClock").textContent = "";
    const s = Math.floor(Date.now() / 1000 - tm.start);
    $("timerClock").textContent = `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  };
  upd(); if (tm) tick = setInterval(upd, 1000);
}

$("timerStop").onclick = async () => { await api("/api/timer", "POST", {action: "stop"}); load(); };
$("reportBtn").onclick = async () => { const r = await api("/api/report", "POST"); toast("Saved " + r.path.split("/").pop()); };
$("addForm").onsubmit = async (e) => {
  e.preventDefault();
  await api("/api/task", "POST", {title: $("addTitle").value, repo: $("addRepo").value || null});
  $("addTitle").value = ""; load();
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load().catch(e => toast("Load failed: " + e.message));
</script>
</body>
</html>
